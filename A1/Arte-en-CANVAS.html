<!doctype html>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<html>
 <head>
   <meta charset="utf-8">
   <title>Arte en CANVAS</title>
   <style>
       body{
        text-align: center;
        background-color: #d9b9f5;
       }
       h1{
        font-family: "DM Serif Display", serif;
        font-size: 85px;
        font-weight: 400;
        font-style: italic;
       }
       canvas{
           border: 5px solid #121b4d;
           background-color: white;
       }
   </style>
   <script>
       var x = 50;       // posición inicial en X
       var y = 150;      // posición inicial en Y
       var dx = 6;       // velocidad horizontal
       var size = 30;    // tamaño de cada cuadrado

       function drawGhost(context, startX, startY, size){
           context.fillStyle = 'pink';
           let ghostPattern = [
               [0,2],[0,3],[0,4],
               [1,1],[1,2],[1,3],[1,4],[1,5],
               [2,0],[2,1],[2,2],[2,3],[2,4],[2,5],[2,6],
               [3,0],[3,1],[3,2],[3,3],[3,4],[3,5],[3,6],
               [4,0],[4,1],[4,2],[4,3],[4,4],[4,5],[4,6],
               [5,0],[5,1],[5,2],[5,3],[5,4],[5,5],[5,6],
               [6,0],[6,2],[6,4],[6,6]
           ];
           ghostPattern.forEach(function(pos){
               let row = pos[0];
               let col = pos[1];
               context.fillRect(startX + col*size, startY + row*size, size, size);
           });

           // Ojos
           context.fillStyle = 'white';
           context.fillRect(startX + 2*size, startY + 2*size, size, size);
           context.fillRect(startX + 4*size, startY + 2*size, size, size);

           // Pupilas
           context.fillStyle = 'darkblue';
           context.fillRect(startX + 2*size, startY + 3*size, size, size);
           context.fillRect(startX + 4*size, startY + 3*size, size, size);
       }

       function animate(){
           requestAnimationFrame(animate);
           var canvas = document.getElementById("micanvas");
           var context = canvas.getContext("2d");
           context.clearRect(0, 0, canvas.width, canvas.height);

           // Dibujar fantasma en la posición actual
           drawGhost(context, x, y, size);

           // Movimiento horizontal
           x += dx;

           // Rebote en los bordes
           let ghostWidth = 7 * size; // ocupa 7 columnas
           if (x <= 0 || x + ghostWidth >= canvas.width){ 
               dx = -dx;
           }
       }
       animate();
   </script>
   </head>
 <body>
    <h1>Boo!</h1>
    <canvas id="micanvas" width="800" height="600"></canvas>
 </body>
</html>
