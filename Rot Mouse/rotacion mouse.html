<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rotate to Mouse</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <style>
      body { 
       
        background-color:rgb(126, 103, 189);
        text-align: center;
      }
      canvas {
        background-color:rgb(254, 250, 230);
      }

      aside {
         color:rgb(244, 238, 255);
         font-size: 25px;
      }

    </style>
    <canvas id="canvas" width="1000" height="700"></canvas>
    <aside>Mueve el mouse alrededor o sobre el goebito :D</aside>
    
    <script src="utils.js"></script>
    <!--<script src="./classes/arrow.js"></script>-->
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          mouse = utils.captureMouse(canvas),
          pelota = new Image();
          pelota.src = 'La roca goebito.png';
        
      (function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.save();
        var x = canvas.width / 2,
            y = canvas.height / 2;

        context.translate(x, y);
        var dx = mouse.x - x,
            dy = mouse.y - y;
        
        var radianes = Math.atan2(dy, dx); //radians
        console.log(radianes);
        context.rotate(radianes); //radians
        var anchoMitad = pelota.width / 2;
        var altoMitad = pelota.height / 2;
        context.drawImage(pelota, -anchoMitad / 2, -altoMitad / 2, anchoMitad, altoMitad);
        context.restore();
        
      }());
    };
    </script>
  </body>
</html>
