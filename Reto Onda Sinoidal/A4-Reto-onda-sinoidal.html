<!doctype html>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
<html>
  <head>
    <meta charset="utf-8">
    <title>Reto Onda Sinoidal</title>
    <style>
      body { 
       
        text-align: center;
        background-image: url("Banner.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
      
      }
     
      h1{
        font-family: "Lobster", sans-serif;
        font-weight: 400;
        font-style: normal;
        font-size: 65px;
       }

    </style>
  </head>  
  <body>
    <h1>Welcome to my Room Tour</h1>
    <canvas id="canvas" width="1000" height="700"></canvas>
    
    <script src="utils.js"></script>
    
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
        
          fondo = new Image();
          pelota = new Image(),
          angle2=60,
          centerScale = 1,
          range = .5,
          escalaX = 1,
          escalaY = 1,
          speed2 = 0.03,
          posicionX = 0,
          posicionY = 20,
          centerY = 200,
          rangeY = 50,
          speedX = 1;
          fondo.src = "cute background.jpg";
          pelota.src = "La roca goebito.PNG";


        
      //ball.x = canvas.width / 2;
      //ball.y = canvas.height / 2;
        
      fondo.onload = function() {
    // Comenzar animación cuando el fondo esté cargado
      requestAnimationFrame(drawFrame);
       };

      (function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.drawImage(fondo, 0, 0, canvas.width, canvas.height);
        
        context.save();
        context.translate(0, 200);
        posicionY = centerY / 2 + Math.sin(angle2) * rangeY;
        angle2 += speed2;
        posicionX += speedX;
        context.drawImage(pelota, posicionX, posicionY, pelota.width*0.5, pelota.height*0.5);
        context.restore();

          if (posicionX + pelota.width * 0.5 > canvas.width) {
          posicionX = canvas.width - pelota.width * 0.5; // lo coloca justo en el borde
          speedX = -speedX;
           }
          if (posicionX < 0) {
          posicionX = 0;
          speedX = -speedX;
           }
          posicionX += speedX;

  // Rebote en Y con corrección
          if (posicionY + pelota.height * 0.5 > canvas.height) {
          posicionY = canvas.height - pelota.height * 0.5;
          speedY = -speedY;
           }
          if (posicionY < 0) {
          posicionY = 0;
          speedY = -speedY;
           }
          posicionY += speedY;



      }());
    };
    </script>
  </body>
</html>
