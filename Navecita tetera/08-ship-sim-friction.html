<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Ship Sim Friction</title>
    <link rel="stylesheet" href="style.css">
    <style>
      body {
        background-color: #ffc6e1;
        align-items: center;
        text-align: center;
      }
      #canvas {
        background-color: #f894c4;
        background-image: url("Fondo mesa.png");
        background-repeat: no-repeat;
        background-size: 1000px 1000px;
        background-position: center;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="1000" height="700"></canvas>
    <aside>Press left and right arrow keys to rotate ship, up to add thrust.</aside>

    <script src="utils.js"></script>
    <script src="Navecita.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          ship = new Nave(),
          vr = 0,
          vx = 0,
          vy = 0,
          thrust = 0,
          friction = 0.97;

      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;

      window.addEventListener('keydown', function (event) {
        switch (event.keyCode) {
        case 37:      //left
          vr = -3;
          break;
        case 39:      //right
          vr = 3;
          break;
        case 38:      //up
          thrust = 0.05;
          ship.showFlame = true;
          break;
        }
      }, false);

      window.addEventListener('keyup', function () {
        vr = 0;
        thrust = 0;
        ship.showFlame = false;
      }, false);

      (function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.clearRect(0, 0, canvas.width, canvas.height);

        ship.rotation += vr * Math.PI / 180;
        var angle = ship.rotation,
            ax = Math.cos(angle) * thrust,
            ay = Math.sin(angle) * thrust,
            left = 0,
            right = canvas.width,
            top = 0,
            bottom = canvas.height;

        vx += ax;
        vy += ay;
        vx *= friction;
        vy *= friction;
        ship.x += vx;
        ship.y += vy;

        //screen wrapping
        if (ship.x + ship.radius > right) {
          ship.x = right - ship.radius;
          vx *= -1;
        } else if (ship.x - ship.radius < left) {
          ship.x = left + ship.radius;
          vx *= -1;
        }
        if (ship.y + ship.radius > bottom) {
          ship.y = bottom - ship.radius;
          vy *= -1;
        } else if (ship.y - ship.radius < top) {
          ship.y = top + ship.radius;
          vy *= -1;
        }
        ship.draw(context);
      }());
    };
    </script>
  </body>
</html>
